name: CI Multi-Platform Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.23.3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Log environment details
        shell: bash
        run: |
          echo "================ Environment Details ================"
          echo "Operating System: ${{ matrix.os }}"
          echo "Node.js version:  $(node -v)"
          echo "npm version:      $(npm -v)"
          echo "Git commit:       $(git rev-parse HEAD)"
          echo "====================================================="

      - name: 1. Clean Install (npm ci)
        run: npm ci

      - name: 2. Lint & TypeScript Check (npm run lint)
        run: npm run lint

      - name: 3. Production Build (npm run build)
        run: npm run build

      - name: 4. Comprehensive Tests (npm run test:all)
        run: npm run test:all
